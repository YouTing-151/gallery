server:
  port: 8080

spring:
  application:
    name: gallery-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/gallery_db?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 密码优先取环境变量 GALLERY_MYSQL_PASSWORD，未设置时使用默认值 123456
    password: ${GALLERY_MYSQL_PASSWORD:123456}

mybatis:
  # Mapper XML 位置
  mapper-locations: classpath:mapper/*.xml
  # 实体类别名包
  type-aliases-package: com.gallery.gallerybackend.entity
  configuration:
    # 下划线转驼峰：collection_id -> collectionId
    map-underscore-to-camel-case: true
    # 控制台打印 SQL（开发环境便于调试）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
